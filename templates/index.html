<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Transcriber</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f7f5; color: #171717; }
    main { width: min(900px, calc(100% - 32px)); margin: 64px auto; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 8px; letter-spacing: -0.04em; }
    .lede { color: #666; margin: 0 0 28px; font-size: 1.05rem; }
    .bar { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 15px 16px; border-radius: 12px; border: 1px solid #d7d7d2; background: white; font-size: 16px; }
    button { padding: 15px 20px; border: 0; border-radius: 12px; background: #171717; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { margin: 16px 0; color: #666; min-height: 24px; }
    .card { background: white; border: 1px solid #e2e2dd; border-radius: 18px; padding: 24px; margin: 18px 0; box-shadow: 0 4px 18px rgba(0,0,0,.03); }
    .hidden { display: none; }
    .meta { display: flex; gap: 14px; flex-wrap: wrap; color: #666; font-size: .95rem; }
    h2 { margin: 0 0 14px; }
    h3 { margin-top: 26px; }
    ul, ol { padding-left: 22px; }
    li { margin: 8px 0; line-height: 1.5; }
    .ingredient { display: grid; grid-template-columns: minmax(110px, .35fr) 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eee; }
    .ingredient:last-child { border-bottom: 0; }
    .qty { font-weight: 700; }
    .muted { color: #777; }
    details { margin-top: 18px; }
    pre { white-space: pre-wrap; font-family: inherit; line-height: 1.55; background: #f7f7f5; padding: 16px; border-radius: 12px; }
    .error { color: #a30000 !important; }
    @media (max-width: 620px) { .bar { flex-direction: column; } button { width: 100%; } main { margin-top: 32px; } .ingredient { grid-template-columns: 1fr; gap: 2px; } }
  </style>
</head>
<body>
  <main>
    <h1>Food Transcriber</h1>
    <p class="lede">Paste a public TikTok or Instagram recipe. Get the useful part back.</p>

    <form id="form" class="bar">
      <input id="url" type="url" required placeholder="https://www.tiktok.com/... or https://www.instagram.com/reel/..." autocomplete="off" />
      <button id="submit" type="submit">Transcribe recipe</button>
    </form>
    <div id="status"></div>

    <section id="result" class="hidden">
      <div class="card">
        <h2 id="name"></h2>
        <div id="meta" class="meta"></div>

        <h3>Ingredients</h3>
        <div id="ingredients"></div>

        <h3>Instructions</h3>
        <ol id="instructions"></ol>

        <div id="notesWrap" class="hidden">
          <h3>Useful notes</h3>
          <ul id="notes"></ul>
        </div>

        <div id="missingWrap" class="hidden">
          <h3>Not stated in the post</h3>
          <ul id="missing"></ul>
        </div>

        <details>
          <summary>Raw transcript</summary>
          <pre id="transcript"></pre>
        </details>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#url');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');

    const text = (value) => value ?? 'Not stated';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.classList.add('hidden');
      status.classList.remove('error');
      status.textContent = 'Pulling the post, transcribing it, and building the recipe…';
      submit.disabled = true;

      try {
        const response = await fetch('/api/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not process this post.');
        render(data);
        status.textContent = 'Done.';
      } catch (error) {
        status.classList.add('error');
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });

    function render(data) {
      const recipe = data.recipe;
      document.querySelector('#name').textContent = recipe.recipe_name || data.source.title || 'Untitled recipe';

      const metaParts = [
        recipe.creator && `Creator: ${recipe.creator}`,
        recipe.yield && `Yield: ${recipe.yield}`,
        recipe.prep_time && `Prep: ${recipe.prep_time}`,
        recipe.cook_time && `Cook: ${recipe.cook_time}`,
        recipe.total_time && `Total: ${recipe.total_time}`
      ].filter(Boolean);
      document.querySelector('#meta').innerHTML = metaParts.map(item => `<span>${escapeHtml(item)}</span>`).join('');

      document.querySelector('#ingredients').innerHTML = (recipe.ingredients || []).map(item => `
        <div class="ingredient">
          <div class="qty">${escapeHtml(text(item.quantity))}</div>
          <div><strong>${escapeHtml(item.item)}</strong>${item.notes ? `<div class="muted">${escapeHtml(item.notes)}</div>` : ''}</div>
        </div>`).join('');

      document.querySelector('#instructions').innerHTML = (recipe.instructions || []).map(step => `<li>${escapeHtml(step)}</li>`).join('');
      fillList('notes', 'notesWrap', recipe.notes || []);
      fillList('missing', 'missingWrap', recipe.missing_details || []);
      document.querySelector('#transcript').textContent = data.transcript || 'No transcript returned.';
      result.classList.remove('hidden');
    }

    function fillList(id, wrapId, items) {
      const wrap = document.querySelector(`#${wrapId}`);
      document.querySelector(`#${id}`).innerHTML = items.map(item => `<li>${escapeHtml(item)}</li>`).join('');
      wrap.classList.toggle('hidden', items.length === 0);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
    }
  </script>
</body>
</html>
